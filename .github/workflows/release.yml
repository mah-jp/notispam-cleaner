name: CI & Chrome Web Store Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Chrome Web Store deployment mode (none = test/build only, draft = upload draft only, publish = upload & submit for review)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - draft
          - publish

permissions:
  contents: read

jobs:
  test:
    name: Test & Verify Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit and integrity tests
        run: npm test

      - name: Verify manifest.json, package.json, and git tag version sync
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("chrome_extension/manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (typeof manifest.version !== "string" || !manifest.version.trim()) {
              console.error("Missing version in chrome_extension/manifest.json");
              process.exit(1);
            }
            if (manifest.version !== pkg.version) {
              console.error(`Version mismatch: manifest.json (${manifest.version}) !== package.json (${pkg.version})`);
              process.exit(1);
            }
            const ref = process.env.GITHUB_REF || "";
            const refName = process.env.GITHUB_REF_NAME || ref.replace(/^refs\/tags\//, "");
            if (ref.startsWith("refs/tags/v")) {
              const expectedTag = `v${manifest.version}`;
              if (refName !== expectedTag) {
                console.error(`Git tag (${refName}) does not match manifest.json version (${expectedTag})`);
                process.exit(1);
              }
            }
            console.log(`Verified version sync: v${manifest.version}`);
          '

      - name: Build and verify extension ZIP archive
        run: |
          VERSION=$(node -e "process.stdout.write(require('./chrome_extension/manifest.json').version || '')")
          test -n "$VERSION"
          ZIP_NAME="notispam-cleaner-v${VERSION}.zip"
          if [ -f "./make_zip.sh" ]; then
            bash ./make_zip.sh
          else
            rm -f "$ZIP_NAME"
            (cd chrome_extension && zip -r "../$ZIP_NAME" . -x "scripts/*" -x "scripts" -x "*/.DS_Store" -x ".DS_Store")
          fi
          test -s "$ZIP_NAME"
          zipinfo -1 "$ZIP_NAME" | grep -qx "manifest.json"
          if zipinfo -1 "$ZIP_NAME" | grep -E "(^|/)scripts(/|$)|(^|/)\.DS_Store$"; then
            echo "Error: Excluded files found inside $ZIP_NAME" >&2
            exit 1
          fi

      - name: Verify Chrome Web Store API v2 credentials and item status
        if: github.repository == 'mah-jp/notispam-cleaner' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID || 'dahnhdiabhegihofjijbchegffnkiaap' }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/cws-publish.js --check-status

  release:
    name: Release & Publish to Chrome Web Store
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish_target == 'draft' || inputs.publish_target == 'publish'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract and validate version
        id: meta
        run: |
          VERSION=$(node -e "
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('chrome_extension/manifest.json', 'utf8'));
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (typeof manifest.version !== 'string' || !manifest.version.trim()) {
              console.error('Error: Failed to read version from chrome_extension/manifest.json');
              process.exit(1);
            }
            if (manifest.version !== pkg.version) {
              console.error('Error: manifest.json (' + manifest.version + ') !== package.json (' + pkg.version + ')');
              process.exit(1);
            }
            process.stdout.write(manifest.version);
          ")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            EXPECTED_TAG="v${VERSION}"
            if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
              echo "Error: Git tag (${GITHUB_REF_NAME}) does not match manifest.json version (${EXPECTED_TAG})" >&2
              exit 1
            fi
          fi
          ZIP_NAME="notispam-cleaner-v${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build extension ZIP package
        run: |
          ZIP_NAME="${{ steps.meta.outputs.zip_name }}"
          if [ -f "./make_zip.sh" ]; then
            bash ./make_zip.sh
          else
            rm -f "$ZIP_NAME"
            (cd chrome_extension && zip -r "../$ZIP_NAME" . -x "scripts/*" -x "scripts" -x "*/.DS_Store" -x ".DS_Store")
          fi
          test -s "$ZIP_NAME"
          zipinfo -1 "$ZIP_NAME" | grep -qx "manifest.json"
          if zipinfo -1 "$ZIP_NAME" | grep -E "(^|/)scripts(/|$)|(^|/)\.DS_Store$"; then
            echo "Error: Excluded files found inside $ZIP_NAME" >&2
            exit 1
          fi

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: ${{ steps.meta.outputs.zip_name }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.zip_name }}
          generate_release_notes: true

      - name: Upload and Publish to Chrome Web Store (API v2)
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID || 'dahnhdiabhegihofjijbchegffnkiaap' }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_target }}" != "publish" ]; then
            EXTRA_ARGS="--upload-only"
          fi
          node scripts/cws-publish.js --zip "${{ steps.meta.outputs.zip_name }}" $EXTRA_ARGS
